<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>มูนนอส รับแปลภาษา รับรองเอกสาร | หัวหิน</title>
<meta name="description" content="รับแปลภาษา ไทย-อังกฤษ รับรองเอกสารและยื่นนิติกรณ์ที่กรมการกงสุล ให้บริการหัวหิน รับงานทั่วประเทศ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Trirong:wght@500;600;700&family=Sarabun:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600&display=swap" rel="stylesheet">
<style>
/* Moonnos : consular seal (ivory paper + navy ink + brass gold) */
:root{color-scheme:light;
--bg:#f6f2ea;--surface:#fffcf6;--ink:#14233f;--muted:#565d6d;--navy:#14233f;--navy2:#22396a;--accent:#a9802f;--accent-ink:#8a6520;--accent-soft:#f1e6cc;--line:#e3dac7;--hdbg:rgba(246,242,234,.9);
--paper:#fbf7ef;--shadow:0 1px 0 rgba(20,35,63,.04),0 8px 24px -10px rgba(20,35,63,.14);--ph:#f1e2b9;
--serif:"Trirong","Noto Serif SC",Georgia,serif;--sans:"Sarabun","Noto Sans SC",system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0d1626;--surface:#142038;--ink:#efe9dc;--muted:#a7adbb;--navy:#0a1220;--navy2:#1b2f57;--accent:#d6b062;--accent-ink:#e2c27d;--accent-soft:#2a2416;--line:#27334c;--hdbg:rgba(13,22,38,.9);--paper:#111b30;--shadow:0 1px 0 rgba(0,0,0,.3),0 10px 26px -10px rgba(0,0,0,.6)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0d1626;--surface:#142038;--ink:#efe9dc;--muted:#a7adbb;--navy:#0a1220;--navy2:#1b2f57;--accent:#d6b062;--accent-ink:#e2c27d;--accent-soft:#2a2416;--line:#27334c;--hdbg:rgba(13,22,38,.9);--paper:#111b30;--shadow:0 1px 0 rgba(0,0,0,.3),0 10px 26px -10px rgba(0,0,0,.6)}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.75;-webkit-text-size-adjust:100%;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{margin:0;line-height:1.35;font-family:var(--serif);font-weight:600;letter-spacing:0}
a{color:inherit}.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.ph{background:var(--ph);color:#14233f;padding:0 6px;border-radius:4px}

/* header */
.hd{position:sticky;top:0;z-index:50;background:var(--hdbg);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.in{display:flex;align-items:center;gap:10px;max-width:1080px;margin:0 auto;padding:10px 20px;position:relative}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;text-decoration:none;font-family:var(--serif);font-weight:600;font-size:1.16rem}
.brand svg{width:26px;height:26px;fill:var(--accent)}
.logo{height:38px;width:38px;object-fit:cover;display:block;border-radius:50%;box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--accent)}
.links{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;background:var(--surface);border-bottom:1px solid var(--line);padding:6px 20px 14px;box-shadow:var(--shadow)}
.links.open{display:flex}.links a{padding:14px 0;text-decoration:none;font-weight:500;border-bottom:1px solid var(--line)}
.chat{background:var(--navy);color:#fff;text-decoration:none;font-weight:600;font-size:.95rem;padding:0 18px;min-height:46px;display:inline-flex;align-items:center;border-radius:8px;white-space:nowrap}
.burger{width:46px;height:46px;border:1px solid var(--line);background:var(--surface);border-radius:8px;display:grid;place-content:center;gap:5px;cursor:pointer}
.burger i{display:block;width:20px;height:2px;background:var(--ink);border-radius:2px}

/* hero : navy with security-paper hatching and a gold moon glow */
.hero{background:radial-gradient(520px 380px at 92% 0,rgba(214,176,98,.22),transparent 60%),radial-gradient(900px 420px at 10% 120%,#22396a,transparent 65%),#14233f;color:#fff;padding:48px 0 96px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(135deg,rgba(214,176,98,.07) 0 1px,transparent 1px 9px),repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 1px,transparent 1px 9px);-webkit-mask-image:linear-gradient(180deg,#000,transparent 80%);mask-image:linear-gradient(180deg,#000,transparent 80%)}
.hero::after{content:"";position:absolute;left:10px;right:10px;top:10px;bottom:10px;border:1px solid rgba(214,176,98,.28);border-radius:4px;pointer-events:none}
.hgrid{position:relative;display:grid;gap:40px}
.badge{display:inline-flex;align-items:center;gap:10px;font-size:.86rem;font-weight:600;letter-spacing:.06em;color:#e6c98a;margin-bottom:22px}
.badge::before,.badge::after{content:"";width:26px;height:1px;background:linear-gradient(90deg,transparent,#d6b062)}
.badge::after{background:linear-gradient(90deg,#d6b062,transparent)}
.hero h1{font-size:clamp(2rem,6.6vw,3.4rem);font-weight:600;line-height:1.3}
.hero p{color:#c3cbdb;max-width:34em;margin:20px 0 30px}
.btns{display:flex;flex-direction:column;gap:12px}
.btn{display:flex;align-items:center;justify-content:center;min-height:54px;padding:10px 26px;border-radius:8px;font-weight:600;font-size:1.04rem;text-decoration:none;text-align:center;transition:transform .15s,background-color .15s}
.btn.gold{background:linear-gradient(180deg,#e0bd72,#c9a14f);color:#14233f;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 20px -8px rgba(214,176,98,.7)}
.btn.gold:hover{transform:translateY(-1px)}
.btn.ghost{border:1px solid rgba(230,201,138,.55);color:#fff}
.btn.ghost:hover{background:rgba(255,255,255,.07)}

/* hero illustration : two papers, the translated one carries a gold seal */
.docs{position:relative;height:236px}
.sheet{position:absolute;width:64%;background:#fbf7ef;border-radius:3px;padding:20px 18px;box-shadow:0 26px 50px -12px rgba(0,0,0,.55)}
.sheet.a{left:0;top:0;transform:rotate(-4deg);opacity:.92}.sheet.b{right:0;top:36px;transform:rotate(3deg)}
.sheet.b::after{content:"";position:absolute;right:14px;bottom:12px;width:50px;height:50px;border-radius:50%;border:2px solid rgba(169,128,47,.8);box-shadow:inset 0 0 0 4px #fbf7ef,inset 0 0 0 5px rgba(169,128,47,.6);transform:rotate(-12deg)}
.sheet em{font-style:normal;font-size:.72rem;font-weight:700;letter-spacing:.12em;color:#8a6520;border:1px solid #c9a14f;padding:1px 9px;border-radius:2px}
.sheet i{display:block;height:6px;border-radius:3px;background:#e2dccf;margin:12px 0;width:92%}.sheet i.s{width:58%}

/* stats */
.statbox{position:relative;z-index:2;margin-top:-48px;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:6px;box-shadow:var(--shadow);display:grid;grid-template-columns:repeat(3,1fr)}
.stat{padding:20px 8px;text-align:center;border-right:1px solid var(--line)}.stat:last-child{border-right:0}
.stat b{display:block;font-family:var(--serif);font-size:1.22rem;line-height:1.35;font-weight:600}
.stat span{display:block;font-size:.8rem;color:var(--muted);line-height:1.5;margin-top:4px}

/* sections */
.sec{padding:64px 0}.alt{background:var(--paper);border-block:1px solid var(--line)}
.sh{margin-bottom:32px}
.sh h2{font-size:clamp(1.65rem,4.8vw,2.3rem)}
.sh::before{content:"\2726";display:block;width:64px;margin-bottom:14px;text-align:center;font-size:13px;line-height:14px;color:var(--accent);background:linear-gradient(var(--accent),var(--accent)) 0 50%/22px 1px no-repeat,linear-gradient(var(--accent),var(--accent)) 100% 50%/22px 1px no-repeat}
.lead{color:var(--muted);margin:12px 0 0;max-width:36em}
.grid3{display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:24px;box-shadow:var(--shadow);display:flex;flex-direction:column;position:relative}
.card::before{content:"";position:absolute;left:24px;right:24px;top:-1px;height:2px;background:var(--accent);transform:scaleX(.2);transform-origin:left;transition:transform .3s}
.card:hover::before{transform:scaleX(1)}
.ico{width:46px;height:46px;border-radius:50%;background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent);display:grid;place-items:center;margin-bottom:16px}
.ico svg{width:22px;height:22px;stroke:var(--accent-ink);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.card h3{font-size:1.22rem;margin-bottom:8px}.card p{margin:0 0 18px;color:var(--muted);font-size:.97rem}
.price{margin-top:auto;padding-top:14px;border-top:1px dashed var(--line);font-family:var(--serif);font-size:1.6rem;font-weight:600}
.price small{font-family:var(--sans);font-size:.88rem;font-weight:400;color:var(--muted)}

/* steps */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:24px}
.stp{position:relative;padding-left:62px}
.stp .n{position:absolute;left:0;top:0;width:44px;height:44px;border-radius:50%;border:1px solid var(--accent);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 4px var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--serif);font-weight:600;font-size:1.1rem;background:var(--paper)}
.stp b{display:block;font-size:1.08rem;padding-top:7px;font-weight:600}.stp span{color:var(--muted);font-size:.95rem}

/* example receipt : looks like an issued document */
.receipt{background:var(--surface) linear-gradient(var(--accent),var(--accent)) 0 0/100% 3px no-repeat;border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);padding:26px 24px 22px;max-width:580px}
.doc{font-family:var(--serif);font-weight:600;font-size:1.12rem;margin-bottom:6px;padding-bottom:10px;border-bottom:1px solid var(--ink)}
.row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line)}
.row span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.row.total{border-bottom:0;border-top:3px double var(--ink);margin-top:6px;font-family:var(--serif);font-size:1.4rem;font-weight:600;color:var(--accent-ink);padding-top:14px}
.note{font-size:.88rem;color:var(--muted);margin-top:12px}
.pp h3{margin-bottom:10px}.pp .note{margin-top:auto;padding-top:14px;border-top:1px dashed var(--line)}
.pp p{margin:0 0 14px}
.pp b{font-family:var(--serif);font-weight:600}

/* faq */
details{background:var(--surface);border:1px solid var(--line);border-radius:6px;margin-bottom:10px}
details[open]{border-color:var(--accent)}
summary{cursor:pointer;list-style:none;padding:18px 54px 18px 20px;font-weight:600;position:relative;min-height:58px}summary::-webkit-details-marker{display:none}
summary::after{content:"";position:absolute;right:22px;top:50%;width:9px;height:9px;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:translateY(-70%) rotate(45deg);transition:transform .2s}
details[open] summary::after{transform:translateY(-30%) rotate(-135deg)}details p{margin:0;padding:0 20px 20px;color:var(--muted)}

/* contact */
.contact{background:radial-gradient(520px 320px at 85% 0,rgba(214,176,98,.18),transparent 62%),#14233f;color:#fff;text-align:center;padding:72px 0;position:relative;overflow:hidden}
.contact::before{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(135deg,rgba(214,176,98,.06) 0 1px,transparent 1px 9px);-webkit-mask-image:linear-gradient(0deg,#000,transparent 80%);mask-image:linear-gradient(0deg,#000,transparent 80%)}
.contact .wrap{position:relative}
.contact h2{font-size:clamp(1.75rem,5.2vw,2.5rem)}.contact p{color:#c3cbdb;margin:14px 0 30px}
.contact .btns{justify-content:center}
.cgrid{display:grid;gap:34px;align-items:center;justify-items:center}
.qr{background:#fbf7ef;color:#14233f;border-radius:6px;padding:16px 16px 14px;width:236px;text-align:center;box-shadow:0 0 0 1px rgba(214,176,98,.55),0 0 0 7px rgba(251,247,239,.07),0 24px 48px rgba(0,0,0,.35)}
.qr img{display:block;width:100%;height:auto;border-radius:3px}.qr span{display:block;font-size:.88rem;font-weight:600;margin-top:10px}

footer{padding:36px 0;font-size:.86rem;color:var(--muted);text-align:center}footer p{margin:0 0 12px}
.flogo{width:128px;margin:6px auto 20px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 4px var(--bg),0 0 0 5px var(--accent)}.flogo img{display:block;width:100%;height:auto}

/* mobile dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--hdbg);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.dock a{flex:1;min-height:52px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:600;text-decoration:none}
.dock .l{background:var(--navy);color:#fff;box-shadow:inset 0 -3px 0 #c9a14f}.dock .t{border:1px solid var(--line);background:var(--surface);color:var(--ink)}

/* language menu */
.lm{position:relative}
.lmb{font:inherit;min-height:46px;min-width:62px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.lmb::after{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-2px) rotate(45deg)}
.fl{width:28px;height:19px;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.18);display:block;flex:none}
.lmenu{position:absolute;right:0;top:calc(100% + 8px);z-index:60;min-width:170px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:6px}
.lmenu[hidden]{display:none}
.lmenu button{font:inherit;display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:0 12px;border:0;border-radius:6px;background:none;color:var(--ink);cursor:pointer;text-align:left}
.lmenu button:hover,.lmenu button[aria-current="true"]{background:var(--accent-soft);font-weight:600}

/* LINE QR popup */
.qm{position:fixed;inset:0;z-index:100;background:rgba(8,14,26,.74);display:grid;place-items:center;padding:20px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.qm[hidden]{display:none}
.qc{position:relative;background:#fbf7ef;color:#14233f;border-radius:8px;padding:22px 22px 20px;width:min(100%,340px);text-align:center;border-top:4px solid #c9a14f;box-shadow:0 30px 60px rgba(0,0,0,.45)}
.qc img{display:block;width:100%;height:auto;border-radius:4px}
.qc p{margin:14px 0;font-weight:600;line-height:1.5}
.qc .go{display:flex;align-items:center;justify-content:center;min-height:50px;border-radius:8px;background:#14233f;color:#fff;text-decoration:none;font-weight:600;box-shadow:inset 0 -3px 0 #c9a14f}
.qc .x{position:absolute;top:-16px;right:-8px;width:44px;height:44px;border-radius:50%;border:0;background:#14233f;color:#e6c98a;font-size:1.5rem;line-height:1;cursor:pointer;box-shadow:0 0 0 2px #c9a14f,0 6px 16px rgba(0,0,0,.35)}
@media(max-width:639px){.chat{display:none}}

/* booking */
.bk,.bk-form{display:grid;gap:20px;max-width:680px}.bk h3{font-size:1.1rem}
.days{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.day{font:inherit;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;cursor:pointer;color:var(--ink);min-height:64px;transition:border-color .15s}
.day:hover{border-color:var(--accent)}
.days>p{grid-column:1/-1}
.day b{display:block;font-weight:600}.day small{color:var(--muted)}
.day[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.day:disabled{opacity:.5;cursor:not-allowed}
.fld{display:grid;gap:6px}.fld label{font-weight:600;font-size:.95rem}
.fld input,.fld textarea{font:inherit;font-size:16px;min-height:52px;padding:10px 14px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.fld input:focus,.fld textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fld textarea{min-height:96px;resize:vertical}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.msg{padding:14px 16px;border-radius:6px;font-size:.96rem;margin:0}.msg.ok{background:var(--accent-soft);border:1px solid var(--accent)}.msg.er{background:#fbecea;color:#7a1b1b;border:1px solid #e6b3ad}
.sub{background:#14233f;color:#fff;border:0;border-radius:8px;min-height:56px;font:inherit;font-weight:700;font-size:1.05rem;cursor:pointer;box-shadow:inset 0 -3px 0 #c9a14f}.sub:disabled{opacity:.6;cursor:wait}
:root[data-theme="dark"] .sub{background:#d6b062;color:#14233f;box-shadow:none}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .sub{background:#d6b062;color:#14233f;box-shadow:none}}
.err{padding:40px 20px;text-align:center}

@media(min-width:640px){.days{grid-template-columns:repeat(3,1fr)}.btns{flex-direction:row}.btn{min-width:230px}.grid3{grid-template-columns:repeat(2,1fr)}.steps{grid-template-columns:repeat(2,1fr)}.hero::after{left:20px;right:20px;top:20px;bottom:20px}}
@media(min-width:900px){
 body{padding-bottom:0}.dock{display:none}.burger{display:none}
 .links{display:flex;position:static;flex-direction:row;gap:4px;background:none;border:0;box-shadow:none;padding:0}.links a{padding:10px 12px;border:0;color:var(--muted);font-size:.95rem}.links a:hover{color:var(--ink)}
 .hgrid{grid-template-columns:1.15fr .85fr;align-items:center}.docs{height:300px}.hero{padding:84px 0 120px}
 .grid3{grid-template-columns:repeat(3,1fr)}.steps{grid-template-columns:repeat(4,1fr)}
 .cgrid{grid-template-columns:1.2fr .8fr;text-align:left;justify-items:stretch}.cgrid .qr{justify-self:center}.contact .btns{justify-content:flex-start}
 .sec{padding:84px 0}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}summary::after,.card::before,.btn{transition:none}}
</style>

<body>
<div id="app"></div>
<script>
const QR = "line-qr.jpg";
const LOGO_MARK = "logo-mark.jpg";
const LOGO_FULL = "logo.jpg";
const PH = /(\[[^\]]+\])/;
const ICONS = {
  document: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>',
  translate: '<path d="M4 5h9M8.5 3v2M6 5c0 4 3 7 7 8M12 5c0 3-3 7-8 9"/><path d="M13 21l4-9 4 9M14.5 18h5"/>',
  shield: '<path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/>'
};
function txt(s) {
  const f = document.createDocumentFragment();
  String(s).split(PH).forEach((p) => {
    if (!p) return;
    if (PH.test(p)) { const e = document.createElement("span"); e.className = "ph"; e.textContent = p; f.append(e); } else f.append(p);
  });
  return f;
}
function el(tag, cls, text, attrs) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null && text !== "") e.append(txt(text));
  if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
function priceEl(s) {
  const p = el("div", "price");
  if (s.prefix) p.append(el("small", null, s.prefix + " "));
  p.append(s.price + " ");
  if (s.unit) p.append(el("small", null, s.unit));
  return p;
}
function sec(id, c, alt) {
  const s = el("section", "sec" + (alt ? " alt" : ""), null, { id }), w = el("div", "wrap"), h = el("div", "sh");
  h.append(el("h2", null, c.title));
  if (c.lead) h.append(el("p", "lead", c.lead));
  w.append(h); s.append(w);
  return [s, w];
}
const FLAGS = {
  th: '<svg class="fl" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#A51931"/><rect y="3.33" width="30" height="13.34" fill="#F4F5F8"/><rect y="6.67" width="30" height="6.66" fill="#2D2A4A"/></svg>',
  en: '<svg class="fl" viewBox="0 0 60 40" preserveAspectRatio="none" aria-hidden="true"><rect width="60" height="40" fill="#012169"/><path d="M0 0L60 40M60 0L0 40" stroke="#fff" stroke-width="8"/><path d="M0 0L60 40M60 0L0 40" stroke="#C8102E" stroke-width="3"/><path d="M30 0V40M0 20H60" stroke="#fff" stroke-width="13"/><path d="M30 0V40M0 20H60" stroke="#C8102E" stroke-width="8"/></svg>',
  zh: '<svg class="fl" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#DE2910"/><g fill="#FFDE00"><polygon points="5.00,2.00 5.67,4.07 7.85,4.07 6.09,5.35 6.76,7.43 5.00,6.15 3.24,7.43 3.91,5.35 2.15,4.07 4.33,4.07"/><polygon points="10.77,2.46 10.13,2.32 9.80,2.88 9.74,2.23 9.10,2.08 9.71,1.82 9.65,1.17 10.08,1.66 10.68,1.41 10.34,1.97"/><polygon points="12.89,4.13 12.25,4.24 12.15,4.89 11.85,4.31 11.20,4.42 11.66,3.95 11.35,3.37 11.94,3.66 12.40,3.19 12.30,3.84"/><polygon points="12.87,6.75 12.32,7.12 12.50,7.75 11.99,7.34 11.45,7.71 11.67,7.09 11.15,6.69 11.81,6.71 12.03,6.10 12.21,6.73"/><polygon points="10.70,8.44 10.34,8.98 10.75,9.49 10.12,9.32 9.76,9.87 9.73,9.21 9.10,9.04 9.71,8.81 9.68,8.16 10.09,8.67"/></g></svg>'
};
document.addEventListener("click", (e) => { const m = document.querySelector(".lmenu"); if (m && !m.hidden && !e.target.closest(".lm")) { m.hidden = true; const b = document.querySelector(".lmb"); if (b) b.setAttribute("aria-expanded", "false"); } });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { const m = document.querySelector(".lmenu"); if (m && !m.hidden) { m.hidden = true; const b = document.querySelector(".lmb"); if (b) { b.setAttribute("aria-expanded", "false"); b.focus(); } } } });
const QRTXT = { th: { open: "เปิดใน LINE", close: "ปิด" }, en: { open: "Open in LINE", close: "Close" }, zh: { open: "在 LINE 中打开", close: "关闭" } };
let QM = null;
function showQR(c) {
  const u = c.ui, t = QRTXT[LANG] || QRTXT.th;
  if (!QM) {
    QM = el("div", "qm", null, { role: "dialog", "aria-modal": "true" }); QM.hidden = true;
    QM.addEventListener("click", (e) => { if (e.target === QM) QM.hidden = true; });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && QM && !QM.hidden) QM.hidden = true; });
    document.body.append(QM);
  }
  QM.textContent = "";
  const card = el("div", "qc"), x = el("button", "x", "×", { type: "button", "aria-label": t.close });
  x.onclick = () => { QM.hidden = true; };
  const im = el("img", null, null, { src: QR, alt: u.qr_alt });
  const go = el("a", "go", t.open, { href: c.line_url, target: "_blank", rel: "noopener" });
  card.append(x, im, el("p", null, u.qr_cap), go);
  QM.append(card); QM.hidden = false; x.focus();
}
function bindQR(a, c) { a.addEventListener("click", (e) => { e.preventDefault(); showQR(c); }); }
const LANGS = { th: { file: "content.json", loc: "th-TH", name: "ไทย" }, en: { file: "content.en.json", loc: "en-GB", name: "English" }, zh: { file: "content.zh.json", loc: "zh-CN", name: "中文" } };
let LANG = "th";
function TH(s) {
  const [y, m, d] = s.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(LANGS[LANG].loc, { weekday: "short", day: "numeric", month: "short" });
}
function bk(c, p) {
  const r = p ? fetch(c.booking_api, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(p) }) : fetch(c.booking_api);
  return r.then((x) => x.json());
}
function booking(c) {
  const u = c.ui;
  const [s, w] = sec("booking", { title: u.bk_title, lead: u.bk_lead }, true);
  const days = el("div", "days"), msg = el("div"), form = el("form", "bk-form");
  let pick = "";
  const F = (id, label, inner) => { const d = el("div", "fld"); d.append(el("label", null, label, { for: id })); d.insertAdjacentHTML("beforeend", inner); return d; };
  form.append(
    F("bn", u.f_name, '<input id="bn" name="name" autocomplete="name" required maxlength="80">'),
    F("bp", u.f_phone, '<input id="bp" name="phone" type="tel" inputmode="tel" autocomplete="tel" required maxlength="20">'),
    F("bl", u.f_line, '<input id="bl" name="line" maxlength="60">'),
    F("bt", u.f_note, '<textarea id="bt" name="note" rows="3" maxlength="300"></textarea>')
  );
  const hp = el("div", "hp", null, { "aria-hidden": "true" }), hl = el("label", null, u.f_hp);
  hl.insertAdjacentHTML("beforeend", '<input name="website" tabindex="-1" autocomplete="off">'); hp.append(hl);
  const sb = el("button", "sub", u.bk_submit, { type: "submit" });
  form.append(hp, sb);
  const h1 = el("h3", null, u.bk_step1), h2 = el("h3", null, u.bk_step2);
  async function load() {
    days.textContent = u.bk_loading;
    try {
      const r = await bk(c);
      if (!r.ok) throw new Error("load");
      days.textContent = "";
      if (!r.slots.length) { days.append(el("p", "lead", u.bk_none)); return; }
      r.slots.forEach((x) => {
        const full = x.remaining < 1, b = el("button", "day", null, { type: "button", "aria-pressed": String(pick === x.date) });
        b.disabled = full;
        b.append(el("b", null, TH(x.date)), el("small", null, full ? u.bk_full : u.bk_left.replace("{n}", x.remaining)));
        b.onclick = () => { pick = x.date; days.querySelectorAll(".day").forEach((d) => d.setAttribute("aria-pressed", "false")); b.setAttribute("aria-pressed", "true"); };
        days.append(b);
      });
    } catch (e) { days.textContent = ""; days.append(el("p", "msg er", u.bk_load_err)); }
  }
  form.onsubmit = async (e) => {
    e.preventDefault(); msg.textContent = "";
    if (!pick) { msg.append(el("div", "msg er", u.bk_pick)); return; }
    const fd = new FormData(form), btn = form.querySelector(".sub");
    btn.disabled = true;
    try {
      const r = await bk(c, { date: pick, name: fd.get("name"), phone: fd.get("phone"), line: fd.get("line"), note: fd.get("note"), website: fd.get("website") });
      if (r.ok) { msg.append(el("div", "msg ok", u.bk_ok.replace("{d}", TH(pick)))); form.reset(); pick = ""; await load(); }
      else msg.append(el("div", "msg er", u.err[r.error] || u.bk_fail));
    } catch (x) { msg.append(el("div", "msg er", u.bk_sys_err)); }
    btn.disabled = false;
  };
  const box = el("div", "bk");
  box.append(h1, days, h2, form, msg); w.append(box);
  load();
  return s;
}
function render(c) {
  const u = c.ui;
  document.documentElement.lang = u.html_lang;
  document.title = u.title;
  const md = document.querySelector('meta[name="description"]'); if (md) md.setAttribute("content", u.desc);
  const app = document.getElementById("app");
  app.textContent = "";

  const hd = el("header", "hd"), inn = el("div", "in");
  const brand = el("a", "brand", null, { href: "#top" });
  const lg = el("img", "logo", null, { src: LOGO_MARK, alt: "" });
  lg.onerror = () => lg.remove();
  brand.append(lg, c.brand.join(""));
  const links = el("nav", "links", null, { "aria-label": u.menu_aria, id: "menu" });
  (c.booking_api ? c.nav.concat([{ label: u.booking_nav, href: "#booking" }]) : c.nav).forEach((n) => links.append(el("a", null, n.label, { href: n.href })));
  const burger = el("button", "burger", null, { type: "button", "aria-label": u.burger_aria, "aria-expanded": "false", "aria-controls": "menu" });
  burger.innerHTML = "<i></i><i></i><i></i>";
  burger.onclick = () => { const o = links.classList.toggle("open"); burger.setAttribute("aria-expanded", String(o)); };
  links.addEventListener("click", (e) => { if (e.target.tagName === "A") { links.classList.remove("open"); burger.setAttribute("aria-expanded", "false"); } });
  const lm = el("div", "lm"), lb = el("button", "lmb", null, { type: "button", "aria-haspopup": "true", "aria-expanded": "false", "aria-label": u.lang_aria + ": " + LANGS[LANG].name });
  lb.innerHTML = FLAGS[LANG];
  const lmenu = el("div", "lmenu", null, { role: "menu" }); lmenu.hidden = true;
  Object.keys(LANGS).forEach((k) => {
    const b = el("button", null, null, { type: "button", role: "menuitem", lang: k, "aria-current": String(k === LANG) });
    b.innerHTML = FLAGS[k]; b.append(LANGS[k].name);
    b.onclick = () => { if (k !== LANG) setLang(k); else { lmenu.hidden = true; lb.setAttribute("aria-expanded", "false"); } };
    lmenu.append(b);
  });
  lb.onclick = () => { lmenu.hidden = !lmenu.hidden; lb.setAttribute("aria-expanded", String(!lmenu.hidden)); };
  lm.append(lb, lmenu);
  const chatA = el("a", "chat", c.nav_cta, { href: c.line_url }); bindQR(chatA, c);
  inn.append(brand, links, lm, chatA, burger);
  hd.append(inn);

  const main = el("main", null, null, { id: "top" });
  const hero = el("div", "hero"), hw = el("div", "wrap hgrid"), left = el("div"), hb = el("div", "btns");
  const heroA = el("a", "btn gold", c.hero.primary, { href: c.line_url }); bindQR(heroA, c);
  hb.append(heroA, el("a", "btn ghost", c.hero.secondary.label, { href: c.hero.secondary.href }));
  left.append(el("span", "badge", c.hero.badge), el("h1", null, c.hero.title), el("p", null, c.hero.text), hb);
  const docs = el("div", "docs", null, { "aria-hidden": "true" });
  docs.innerHTML = '<div class="sheet a"><em>TH</em><i></i><i></i><i class="s"></i><i></i></div><div class="sheet b"><em>EN</em><i></i><i></i><i class="s"></i><i></i></div>';
  hw.append(left, docs); hero.append(hw);

  const sw = el("div", "wrap"), sb = el("div", "statbox");
  c.stats.forEach((s) => { const d = el("div", "stat"); d.append(el("b", null, s.big), el("span", null, s.small)); sb.append(d); });
  sw.append(sb);
  main.append(hero, sw);

  let [s, w] = sec("services", c.services);
  const g = el("div", "grid3");
  c.services.items.forEach((it) => {
    const card = el("div", "card rv"), ico = el("div", "ico");
    ico.innerHTML = '<svg viewBox="0 0 24 24">' + (ICONS[it.icon] || ICONS.document) + "</svg>";
    card.append(ico, el("h3", null, it.title), el("p", null, it.text), priceEl(it)); g.append(card);
  });
  w.append(g); main.append(s);

  [s, w] = sec("steps", c.steps, true);
  const ol = el("ol", "steps");
  c.steps.items.forEach((it, i) => { const li = el("li", "stp rv"); li.append(el("span", "n", String(i + 1)), el("b", null, it.title), el("span", null, it.text)); ol.append(li); });
  w.append(ol); main.append(s);

  [s, w] = sec("example", c.example);
  const rc = el("div", "receipt rv");
  rc.append(el("div", "doc", c.example.doc));
  c.example.rows.forEach((r) => { const d = el("div", "row"); d.append(el("span", null, r[0]), el("span", null, r[1])); rc.append(d); });
  const t = el("div", "row total"); t.append(el("span", null, c.example.total[0]), el("span", null, c.example.total[1]));
  const n = el("div", "note", c.example.note); n.append(document.createElement("br"), c.example.disclaimer);
  rc.append(t, n); w.append(rc); main.append(s);

  [s, w] = sec("pricing", c.pricing, true);
  const pg = el("div", "grid3");
  c.pricing.items.forEach((it) => {
    const p = el("div", "card pp rv");
    p.append(el("h3", null, it.title));
    if (it.lines) {
      const q = el("p");
      it.lines.forEach((l, i) => { if (i) q.append(document.createElement("br")); q.append(l[0] + " "); q.append(el("b", null, l[1])); });
      p.append(q);
    } else { const pr = priceEl(it); pr.style.border = "0"; pr.style.paddingTop = "0"; pr.style.marginTop = "0"; pr.style.marginBottom = "14px"; p.append(pr); }
    p.append(el("div", "note", c.pricing.note)); pg.append(p);
  });
  w.append(pg); main.append(s);

  if (c.booking_api) main.append(booking(c));

  [s, w] = sec("faq", c.faq);
  c.faq.items.forEach((it) => { const d = el("details", "rv"); d.append(el("summary", null, it.q), el("p", null, it.a)); w.append(d); });
  main.append(s);

  const ct = el("section", "contact", null, { id: "contact" }), cw = el("div", "wrap cgrid"), cl = el("div"), cb = el("div", "btns");
  const lineA = el("a", "btn gold", c.contact.line_label, { href: c.line_url }); bindQR(lineA, c);
  cb.append(lineA, el("a", "btn ghost", c.contact.phone_label, { href: c.contact.phone_href }));
  cl.append(el("h2", null, c.contact.title), el("p", null, c.contact.text), cb);
  const qr = el("div", "qr"), qi = el("img", null, null, { src: QR, alt: u.qr_alt });
  qr.append(qi, el("span", null, u.qr_cap));
  cw.append(cl, qr); ct.append(cw); main.append(ct);

  const f = el("footer"), fw = el("div", "wrap"), fb = el("p"), F = c.footer;
  if (F.facebook_url) fb.append(el("a", null, F.facebook_label, { href: F.facebook_url, target: "_blank", rel: "noopener" }));
  else fb.append(el("span", "ph", F.facebook_placeholder));
  const fl = el("div", "flogo"), fi = el("img", null, null, { src: LOGO_FULL, alt: "MOONNOS" });
  fi.onerror = () => fl.remove(); fl.append(fi);
  fw.append(fl, fb, el("p", null, F.disclaimer), el("p", null, F.copyright)); f.append(fw);

  const dock = el("div", "dock");
  const dockA = el("a", "l", u.dock_line, { href: c.line_url }); bindQR(dockA, c);
  dock.append(dockA, el("a", "t", u.dock_call, { href: c.contact.phone_href }));

  app.append(hd, main, f, dock);

}
function setLang(k) {
  if (!LANGS[k]) k = "th";
  LANG = k;
  try { localStorage.setItem("lang", k); } catch (e) {}
  fetch(LANGS[k].file, { cache: "no-cache" }).then((r) => r.json()).then(render).catch(() => {
    document.getElementById("app").innerHTML = '<p class="err">โหลดข้อมูลหน้าเว็บไม่สำเร็จ กรุณารีเฟรชหน้าอีกครั้ง / Could not load the page. Please refresh. / 页面加载失败,请刷新。</p>';
  });
}
(function () {
  let k = "th";
  try { localStorage.setItem; k = localStorage.getItem("lang") || "th"; } catch (e) {}
  const q = new URLSearchParams(location.search).get("lang");
  if (q && LANGS[q]) k = q;
  setLang(k);
})();
</script>
</body>
</html>
