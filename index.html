<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>มูนนอส รับแปลภาษา รับรองเอกสาร | หัวหิน</title>
<meta name="description" content="รับแปลภาษา ไทย-อังกฤษ รับรองเอกสารและยื่นนิติกรณ์ที่กรมการกงสุล ให้บริการหัวหิน รับงานทั่วประเทศ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@600;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
--bg:#f6f1e6;--alt:#efe8d6;--ink:#1b2540;--muted:#565d72;--navy:#1b2a52;--on-navy:#f6f1e6;--gold:#9a6f17;--gold-fill:#c9973a;--line:#d6cdb6;--ph:#f3e7c9}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1526;--alt:#151d36;--ink:#efe9d8;--muted:#a4abc0;--navy:#0a0f1d;--on-navy:#efe9d8;--gold:#e0b455;--gold-fill:#e0b455;--line:#2a3558}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1526;--alt:#151d36;--ink:#efe9d8;--muted:#a4abc0;--navy:#0a0f1d;--on-navy:#efe9d8;--gold:#e0b455;--gold-fill:#e0b455;--line:#2a3558}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai",system-ui,sans-serif;font-size:18px;line-height:1.75;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
h1,h2,h3{font-family:"Noto Serif Thai",serif;line-height:1.35;margin:0}
a{color:inherit}.wrap{max-width:960px;margin:0 auto;padding:0 22px}
:focus-visible{outline:3px solid var(--gold-fill);outline-offset:3px}
.ph{background:var(--ph);color:#1b2540;padding:0 6px;border-radius:5px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:12px;max-width:960px;margin:0 auto;padding:8px 22px}
.brand{font-family:"Noto Serif Thai",serif;font-weight:700;font-size:1.25rem;text-decoration:none;white-space:nowrap}.brand span{color:var(--gold)}
.links{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}.links::-webkit-scrollbar{display:none}
.links a{padding:10px 12px;text-decoration:none;font-size:.95rem;white-space:nowrap;color:var(--muted)}
.chat{background:var(--ink);color:var(--bg);text-decoration:none;font-weight:600;padding:10px 18px;border-radius:6px;min-height:48px;display:inline-flex;align-items:center;font-size:.95rem;white-space:nowrap}
.hero{position:relative;overflow:hidden;padding:56px 0 48px;border-bottom:1px solid var(--line)}
.moon{position:absolute;right:-50px;top:-30px;width:300px;height:300px;fill:var(--gold-fill);opacity:.2;pointer-events:none}
.hero .wrap{position:relative}
.badge{display:inline-block;font-size:.9rem;font-weight:600;letter-spacing:.02em;color:var(--gold);border-bottom:2px solid var(--gold-fill);padding-bottom:2px;margin-bottom:20px}
.hero h1{font-size:clamp(2.1rem,7vw,3.6rem);font-weight:700;max-width:14em}
.hero p{color:var(--muted);max-width:34em;margin:20px 0 30px}
.btns{display:flex;flex-direction:column;gap:12px}
.btn{display:flex;align-items:center;justify-content:center;min-height:56px;padding:12px 24px;border-radius:6px;font-weight:600;font-size:1.05rem;text-decoration:none;text-align:center}
.btn.solid{background:var(--ink);color:var(--bg)}.btn.line{border:2px solid var(--ink)}
.btn.gold{background:var(--gold-fill);color:#1b1608}.btn.ghost{border:2px solid var(--on-navy);color:var(--on-navy)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);max-width:960px;margin:0 auto}
.stat{padding:26px 10px;text-align:center;border-right:1px solid var(--line)}.stat:last-child{border-right:0}
.stat b{display:block;font-family:"Noto Serif Thai",serif;font-size:1.3rem;line-height:1.3}
.stat span{display:block;font-size:.82rem;color:var(--muted);line-height:1.5;margin-top:4px}
.sec{padding:60px 0}.alt{background:var(--alt)}
.sh{margin-bottom:30px}h2{font-size:clamp(1.7rem,5vw,2.3rem)}
h2::after{content:"";display:block;width:56px;height:3px;background:var(--gold-fill);margin-top:12px}
.lead{color:var(--muted);margin:14px 0 0}
.svc{display:grid;grid-template-columns:auto 1fr;gap:4px 18px;padding:26px 0;border-top:1px solid var(--line)}
.svc:last-child{border-bottom:1px solid var(--line)}
.n{font-family:"Noto Serif Thai",serif;font-size:2rem;color:var(--gold);line-height:1;grid-row:span 3}
.svc h3{font-size:1.3rem}.svc p{margin:0;color:var(--muted)}
.price{font-family:"Noto Serif Thai",serif;font-size:1.5rem;font-weight:700;margin-top:6px}
.price small{font-family:"Noto Sans Thai",sans-serif;font-size:.9rem;font-weight:400;color:var(--muted)}
ol.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
ol.steps li{counter-increment:s;border-top:3px solid var(--gold-fill);padding-top:12px}
ol.steps li::before{content:"0" counter(s);font-family:"Noto Serif Thai",serif;font-size:1.6rem;color:var(--gold);display:block}
ol.steps b{display:block;font-size:1.1rem}ol.steps span{color:var(--muted);font-size:.95rem}
.receipt{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:26px;max-width:520px}
.alt .receipt{background:var(--bg)}
.doc{font-weight:600;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dotted var(--muted)}
.row.total{border-bottom:0;font-family:"Noto Serif Thai",serif;font-size:1.4rem;font-weight:700;color:var(--gold);padding-top:16px}
.note{font-size:.9rem;color:var(--muted);margin-top:12px}
.pgrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.pp{border:1.5px solid var(--ink);border-radius:4px;padding:24px;background:var(--bg)}
.pp h3{font-size:1.2rem;margin-bottom:8px}.pp .note{border-top:1px solid var(--line);padding-top:10px;margin-top:14px}
details{border-top:1px solid var(--line)}details:last-of-type{border-bottom:1px solid var(--line)}
summary{cursor:pointer;list-style:none;padding:20px 48px 20px 0;font-weight:600;position:relative;min-height:56px}summary::-webkit-details-marker{display:none}
summary::after{content:"+";position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:1.6rem;color:var(--gold);transition:transform .2s}
details[open] summary::after{transform:translateY(-50%) rotate(45deg)}details p{margin:0;padding:0 0 20px;color:var(--muted)}
.contact{background:var(--navy);color:var(--on-navy);text-align:center;padding:64px 0}
.contact h2::after{margin:12px auto 0}.contact p{opacity:.85;margin:14px 0 28px}
footer{padding:32px 0 44px;font-size:.88rem;color:var(--muted);text-align:center}footer p{margin:0 0 12px}
.err{padding:40px 22px;text-align:center}
@media(min-width:640px){.btns{flex-direction:row}.btn{flex:1;max-width:280px}.contact .btns{justify-content:center}.moon{width:420px;height:420px;right:-30px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}summary::after{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const PH = /(\[[^\]]+\])/;
function txt(s) {
  const f = document.createDocumentFragment();
  String(s).split(PH).forEach((p) => {
    if (!p) return;
    if (PH.test(p)) { const e = document.createElement("span"); e.className = "ph"; e.textContent = p; f.append(e); } else f.append(p);
  });
  return f;
}
function el(tag, cls, text, attrs) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null && text !== "") e.append(txt(text));
  if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
function priceEl(s) {
  const p = el("div", "price");
  if (s.prefix) p.append(el("small", null, s.prefix + " "));
  p.append(s.price + " ");
  if (s.unit) p.append(el("small", null, s.unit));
  return p;
}
function sec(id, c, alt) {
  const s = el("section", "sec" + (alt ? " alt" : ""), null, { id }), w = el("div", "wrap"), h = el("div", "sh");
  h.append(el("h2", null, c.title));
  if (c.lead) h.append(el("p", "lead", c.lead));
  w.append(h); s.append(w);
  return [s, w];
}
function render(c) {
  const app = document.getElementById("app");
  app.textContent = "";
  const header = el("header"), nav = el("div", "nav"), brand = el("a", "brand", null, { href: "#top" });
  brand.append(c.brand[0], el("span", null, c.brand[1]));
  const links = el("nav", "links", null, { "aria-label": "เมนูหลัก" });
  c.nav.forEach((n) => links.append(el("a", null, n.label, { href: n.href })));
  nav.append(brand, links, el("a", "chat", c.nav_cta, { href: c.line_url }));
  header.append(nav);

  const main = el("main", null, null, { id: "top" });
  const hero = el("div", "hero"), hw = el("div", "wrap"), hb = el("div", "btns");
  hero.innerHTML = '<svg class="moon" viewBox="0 0 200 200" aria-hidden="true"><path d="M120 15A85 85 0 1 0 185 125A68 68 0 1 1 120 15Z"/></svg>';
  hb.append(el("a", "btn solid", c.hero.primary, { href: c.line_url }), el("a", "btn line", c.hero.secondary.label, { href: c.hero.secondary.href }));
  hw.append(el("span", "badge", c.hero.badge), el("h1", null, c.hero.title), el("p", null, c.hero.text), hb);
  hero.append(hw);
  const stats = el("div", "stats");
  c.stats.forEach((s) => { const d = el("div", "stat"); d.append(el("b", null, s.big), el("span", null, s.small)); stats.append(d); });
  main.append(hero, stats);

  let [s, w] = sec("services", c.services);
  c.services.items.forEach((it, i) => {
    const r = el("div", "svc");
    r.append(el("span", "n", "0" + (i + 1)), el("h3", null, it.title), el("p", null, it.text), priceEl(it));
    w.append(r);
  });
  main.append(s);

  [s, w] = sec("steps", c.steps, true);
  const ol = el("ol", "steps");
  c.steps.items.forEach((it) => { const li = el("li"); li.append(el("b", null, it.title), el("span", null, it.text)); ol.append(li); });
  w.append(ol); main.append(s);

  [s, w] = sec("example", c.example);
  const rc = el("div", "receipt");
  rc.append(el("div", "doc", c.example.doc));
  c.example.rows.forEach((r) => { const d = el("div", "row"); d.append(el("span", null, r[0]), el("span", null, r[1])); rc.append(d); });
  const t = el("div", "row total"); t.append(el("span", null, c.example.total[0]), el("span", null, c.example.total[1]));
  const n = el("div", "note", c.example.note); n.append(document.createElement("br"), c.example.disclaimer);
  rc.append(t, n); w.append(rc); main.append(s);

  [s, w] = sec("pricing", c.pricing, true);
  const pg = el("div", "pgrid");
  c.pricing.items.forEach((it) => {
    const p = el("div", "pp");
    p.append(el("h3", null, it.title));
    if (it.lines) {
      const q = el("p"); q.style.margin = "0";
      it.lines.forEach((l, i) => { if (i) q.append(document.createElement("br")); q.append(l[0] + " "); q.append(el("b", null, l[1])); });
      p.append(q);
    } else p.append(priceEl(it));
    p.append(el("div", "note", c.pricing.note)); pg.append(p);
  });
  w.append(pg); main.append(s);

  [s, w] = sec("faq", c.faq);
  c.faq.items.forEach((it) => { const d = el("details"); d.append(el("summary", null, it.q), el("p", null, it.a)); w.append(d); });
  main.append(s);

  const ct = el("section", "contact", null, { id: "contact" }), cw = el("div", "wrap"), cb = el("div", "btns");
  cb.append(el("a", "btn gold", c.contact.line_label, { href: c.line_url }), el("a", "btn ghost", c.contact.phone_label, { href: c.contact.phone_href }));
  cw.append(el("h2", null, c.contact.title), el("p", null, c.contact.text), cb); ct.append(cw); main.append(ct);

  const f = el("footer"), fw = el("div", "wrap"), fb = el("p"), F = c.footer;
  if (F.facebook_url) fb.append(el("a", null, F.facebook_label, { href: F.facebook_url, target: "_blank", rel: "noopener" }));
  else fb.append(el("span", "ph", F.facebook_placeholder));
  fw.append(fb, el("p", null, F.disclaimer), el("p", null, F.copyright)); f.append(fw);
  app.append(header, main, f);
}
fetch("content.json", { cache: "no-cache" }).then((r) => r.json()).then(render).catch(() => {
  document.getElementById("app").innerHTML = '<p class="err">โหลด content.json ไม่ได้ หากเปิดไฟล์จากเครื่องโดยตรงจะเป็นแบบนี้ กรุณาเปิดผ่านเว็บที่อัปโหลดแล้ว หรือตรวจว่า content.json เขียนถูกรูปแบบ</p>';
});
</script>
</body>
</html>
